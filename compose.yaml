services:
  api:
    build:
      context: .
      target: backend
    env_file: .env
    environment:
      R8D_DATA_DIR: /data
    volumes:
      - rapid8d-data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8723/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    profiles: [public]
    environment:
      R8D_DOMAIN: ${R8D_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  rapid8d-data:
  caddy-data:
  caddy-config:
