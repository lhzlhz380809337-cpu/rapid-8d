name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Build and verify
        shell: pwsh
        run: |
          .\desktop\build.ps1 -Python (Get-Command python).Source
          .\desktop\build-setup.ps1
          $version = '${{ inputs.tag }}'.TrimStart('v')
          Copy-Item release\Rapid8D-Setup.exe "release\Rapid8D-Setup-$version.exe"
          Compress-Archive -LiteralPath release\Rapid8D -DestinationPath "release\Rapid8D-Portable-$version.zip" -CompressionLevel Optimal
      - name: Upload and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          gh release upload '${{ inputs.tag }}' "release\Rapid8D-Setup-$version.exe" "release\Rapid8D-Portable-$version.zip" --clobber
          gh release edit '${{ inputs.tag }}' --draft=false
